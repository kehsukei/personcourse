name: 构建 APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-sdk-version: 35 # 【重要】请改成你项目的 compileSdk 版本

      - name: 开始打包
        run: gradle assembleDebug --stacktrace --info

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
